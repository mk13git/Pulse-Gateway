; Pulse pager firmware for M5Stack Cardputer ADV (ESP32-S3)
;
; NOTE: verify the [env] `board` line against your exact unit. Cardputer ADV
; is ESP32-S3 based like the original Cardputer, so m5stack-stamps3 /
; esp32-s3-devkitc-1 both work as a base target — M5Unified detects the
; actual Cardputer hardware (screen, keyboard, mic, speaker) at runtime
; regardless of which S3 base board definition you build against.

[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified
    m5stack/M5Cardputer
    bblanchon/ArduinoJson @ ^7.1.0

; SD.h (recordings storage) ships with the ESP32 Arduino core — no extra
; lib_deps entry needed.